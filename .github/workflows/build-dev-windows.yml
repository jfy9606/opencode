name: build-dev-windows

on:
  push:
    branches:
      - dev
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: build-dev-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ensure-no-extra-workflows:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { data } = await github.rest.actions.listRepoWorkflows({ owner: context.repo.owner, repo: context.repo.repo, per_page: 100 })
            for (const workflow of data.workflows) {
              if (workflow.state !== "active" || workflow.name === "build-dev-windows") continue
              console.log(`disabling ${workflow.name} (${workflow.id})`)
              await github.rest.actions.disableWorkflow({ owner: context.repo.owner, repo: context.repo.repo, workflow_id: workflow.id })
            }
            console.log(`checked ${data.workflows.length} workflows`)
            for (const status of ["queued", "in_progress"]) {
              for (let page = 1; ; page++) {
                const runs = await github.rest.actions.listWorkflowRunsForRepo({ owner: context.repo.owner, repo: context.repo.repo, status, per_page: 100, page })
                for (const run of runs.data.workflow_runs) {
                  if (run.name === "build-dev-windows") continue
                  try {
                    console.log(`cancelling ${run.name} run ${run.id} (${run.event})`)
                    await github.rest.actions.cancelWorkflowRun({ owner: context.repo.owner, repo: context.repo.repo, run_id: run.id })
                  } catch (error) {
                    console.log(`cancel ${run.id} failed: ${error.status}`)
                  }
                }
                if (runs.data.workflow_runs.length < 100) break
              }
            }
            console.log("cancelled stray runs")

  build-cli:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun

      - name: Build CLI (win32-x64)
        run: bun ./script/build.ts
        working-directory: packages/opencode

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-cli-windows
          path: packages/opencode/dist/opencode-windows*

  build:
    needs: build-cli
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    env:
      OPENCODE_CHANNEL: dev
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: opencode-cli-windows
          path: packages/opencode/dist

      - name: Prepare desktop app
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop

      - name: Embed dev-build CLI in desktop resources
        shell: pwsh
        run: |
          Copy-Item `
            "${{ github.workspace }}\packages\opencode\dist\opencode-windows-x64\bin\opencode.exe" `
            "${{ github.workspace }}\packages\desktop\resources\opencode-cli.exe" `
            -Force

      - name: Build desktop app
        run: bun run build
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: dev

      - name: Package MSI (win32-x64)
        run: npx electron-builder --win msi --x64 --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        timeout-minutes: 60
        env:
          OPENCODE_CHANNEL: dev

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-cli-windows-x64
          path: packages/opencode/dist/opencode-windows-x64

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-desktop-msi-x64
          path: packages/desktop/dist/*.msi
